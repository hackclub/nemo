name: mnemosyne
version: "0.0.0"
config-version: 2

profile: mnemosyne

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

on-run-end: "{{ analyze_built() }}"

vars:
  fast_reply_seconds: 3600

models:
  mnemosyne:
    +pre-hook: "SET LOCAL work_mem = '256MB'"
    staging:
      +materialized: view
      +post-hook: "{{ grant_read('rails_app') }}"
    marts:
      +materialized: table
      +post-hook: "{{ grant_read('rails_app') }}"
