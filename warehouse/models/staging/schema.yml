version: 2

models:
  - name: dim_member
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: account_type
        data_tests:
          - not_null
          - accepted_values:
              values:
                - Member
                - Multi-Channel Guest
                - Single-Channel Guest
                - Bot
                - Admin
                - Owner
                - Org Owner
      - name: is_claimed
        data_tests: [not_null]
      - name: is_bot
        data_tests: [not_null]
      - name: is_deleted
        data_tests: [not_null]
      - name: is_live
        data_tests: [not_null]
  - name: fct_ingest_run
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: source
        data_tests: [not_null]
      - name: source_key
        data_tests: [not_null]
      - name: logical_date
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              values: [running, ok, failed, skipped, partial, cancelled, abandoned]
      - name: attempt
        data_tests: [not_null]
      - name: error_class
        data_tests:
          - accepted_values:
              values: [auth, cancelled, contended, contract, entity, local, throttle, transport, upstream]
  - name: fct_ingest_incident
    columns:
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              values: [source_failing, credential, quality]
      - name: source_key
        data_tests: [not_null]
      - name: consecutive
        data_tests: [not_null]
      - name: muted
        data_tests: [not_null]
  - name: fct_quality_result
    columns:
      - name: quality_result_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              values: [pass, fail, warn]
  - name: fct_ingest_step_output
    columns:
      - name: parent_run_id
        data_tests: [not_null]
      - name: step_index
        data_tests: [not_null]
  - name: fct_member_history
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: total_messages
        data_tests: [not_null]
  - name: fct_first_post
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: channel_id
        data_tests: [not_null]
      - name: posted_at
        data_tests: [not_null]
  - name: fct_member_retention
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: first_post_on
        data_tests: [not_null]
      - name: posted_within_30d_of_joining
        data_tests: [not_null]
      - name: day_30_covered
        data_tests: [not_null]
      - name: day_90_covered
        data_tests: [not_null]
  - name: fct_analytics_day
    columns:
      - name: source
        data_tests: [not_null]
      - name: ds
        data_tests: [not_null]
      - name: loaded
        data_tests: [not_null]
  - name: dim_channel
    columns:
      - name: channel_id
        data_tests: [unique, not_null]
      - name: archived
        data_tests: [not_null]
  - name: fct_member_activity
    columns:
      - name: user_id
        data_tests: [not_null]
  - name: fct_member_window
    columns:
      - name: user_id
        data_tests: [not_null, unique]
  - name: fct_channel_activity
    columns:
      - name: channel_id
        data_tests: [not_null]
  - name: fct_team_stats
    columns:
      - name: ds
        data_tests: [unique, not_null]
  - name: fct_member_lifetime_messages
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: total_messages
        data_tests: [not_null]
      - name: days_posted
        data_tests: [not_null]
  - name: fct_member_month_messages
    columns:
      - name: month
        data_tests: [not_null]
      - name: user_id
        data_tests: [not_null]
      - name: messages_posted
        data_tests: [not_null]
      - name: days_posted
        data_tests: [not_null]
    data_tests:
      - unique:
          column_name: "month::text || '-' || user_id"
  - name: fct_top_posters
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: window_start
        data_tests: [not_null]
  - name: fct_member_channel
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: channel_id
        data_tests: [not_null]
      - name: messages
        data_tests: [not_null]
      - name: returned
        data_tests: [not_null]
    data_tests:
      - unique:
          column_name: "user_id || '-' || channel_id"
  - name: fct_member_channel_membership
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: channel_id
        data_tests: [not_null]
  - name: fct_worker_heartbeat
    columns:
      - name: worker
        data_tests: [not_null, unique]
      - name: beat_at
        data_tests: [not_null]
  - name: fct_message
    config:
      contract:
        enforced: true
    columns:
      - name: channel_id
        data_type: text
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_channel')
              field: channel_id
      - name: ts
        data_type: text
        data_tests: [not_null]
      - name: author_id
        data_type: text
      - name: author_kind
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              values: [member, bot, unknown]
      - name: bot_id
        data_type: text
      - name: app_id
        data_type: text
      - name: parent_user_id
        data_type: text
      - name: subtype
        data_type: text
      - name: thread_root_ts
        data_type: text
      - name: is_reply
        data_type: boolean
        data_tests: [not_null]
      - name: is_broadcast
        data_type: boolean
        data_tests: [not_null]
      - name: posted_at
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: edited_at
        data_type: timestamp with time zone
      - name: reply_count
        data_type: integer
      - name: reply_users_count
        data_type: integer
      - name: latest_reply_ts
        data_type: text
      - name: reaction_count
        data_type: integer
      - name: reactor_count
        data_type: integer
      - name: file_count
        data_type: integer
      - name: text_length
        data_type: integer
      - name: mention_count
        data_type: integer
      - name: mentioned_ids
        data_type: text[]
      - name: is_question
        data_type: boolean
      - name: is_substantive
        data_type: boolean
      - name: has_link
        data_type: boolean
      - name: emoji_only
        data_type: boolean
      - name: settled
        data_type: boolean
        data_tests: [not_null]
      - name: observed_at
        data_type: timestamp with time zone
        data_tests: [not_null]
  - name: fct_member_message
    config:
      contract:
        enforced: true
    columns:
      - name: channel_id
        data_type: text
        data_tests: [not_null]
      - name: ts
        data_type: text
        data_tests: [not_null]
      - name: author_id
        data_type: text
        data_tests: [not_null]
      - name: author_kind
        data_type: text
        data_tests:
          - accepted_values:
              values: [member]
      - name: bot_id
        data_type: text
      - name: app_id
        data_type: text
      - name: parent_user_id
        data_type: text
      - name: subtype
        data_type: text
      - name: thread_root_ts
        data_type: text
      - name: is_reply
        data_type: boolean
      - name: is_broadcast
        data_type: boolean
      - name: posted_at
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: edited_at
        data_type: timestamp with time zone
      - name: reply_count
        data_type: integer
      - name: reply_users_count
        data_type: integer
      - name: latest_reply_ts
        data_type: text
      - name: reaction_count
        data_type: integer
      - name: reactor_count
        data_type: integer
      - name: file_count
        data_type: integer
      - name: text_length
        data_type: integer
      - name: mention_count
        data_type: integer
      - name: mentioned_ids
        data_type: text[]
      - name: is_question
        data_type: boolean
      - name: is_substantive
        data_type: boolean
      - name: has_link
        data_type: boolean
      - name: emoji_only
        data_type: boolean
      - name: settled
        data_type: boolean
      - name: observed_at
        data_type: timestamp with time zone
  - name: fct_message_first_post
    config:
      contract:
        enforced: true
    columns:
      - name: user_id
        data_type: text
        data_tests: [not_null, unique]
      - name: channel_id
        data_type: text
        data_tests: [not_null]
      - name: ts
        data_type: text
        data_tests: [not_null]
      - name: posted_at
        data_type: timestamp with time zone
        data_tests: [not_null]
  - name: fct_first_response
    columns:
      - name: newcomer_id
        data_tests: [not_null, unique]
      - name: detection_method
        data_tests:
          - not_null
          - accepted_values:
              values: [thread_reply, in_channel_mention, bot_only, none]
      - name: confidence
        data_tests:
          - not_null
          - accepted_values:
              values: [high, medium, none]
      - name: answered
        data_tests: [not_null]
