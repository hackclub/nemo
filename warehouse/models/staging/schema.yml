version: 2

models:
  - name: dim_member
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: account_type
        data_tests:
          - not_null
          - accepted_values:
              values:
                - Member
                - Multi-Channel Guest
                - Single-Channel Guest
                - Bot
                - Admin
                - Owner
                - Org Owner
      - name: is_claimed
        data_tests: [not_null]
      - name: is_bot
        data_tests: [not_null]
      - name: is_deleted
        data_tests: [not_null]
      - name: is_live
        data_tests: [not_null]
  - name: fct_ingest_run
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: source
        data_tests: [not_null]
      - name: status
        data_tests: [not_null]
  - name: fct_ingest_step_output
    columns:
      - name: parent_run_id
        data_tests: [not_null]
      - name: step_index
        data_tests: [not_null]
  - name: fct_member_history
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: total_messages
        data_tests: [not_null]
  - name: fct_member_first_reply
    columns:
      - name: user_id
        data_tests: [unique, not_null]
  - name: fct_first_post
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: posted_at
        data_tests: [not_null]
  - name: fct_member_retention
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: first_post_on
        data_tests: [not_null]
      - name: day_30_covered
        data_tests: [not_null]
      - name: day_90_covered
        data_tests: [not_null]
  - name: fct_analytics_day
    columns:
      - name: source
        data_tests: [not_null]
      - name: ds
        data_tests: [not_null]
      - name: loaded
        data_tests: [not_null]
  - name: dim_channel
    columns:
      - name: channel_id
        data_tests: [unique, not_null]
      - name: archived
        data_tests: [not_null]
  - name: fct_member_activity
    columns:
      - name: user_id
        data_tests: [not_null]
  - name: fct_member_window
    columns:
      - name: user_id
        data_tests: [not_null, unique]
  - name: fct_channel_activity
    columns:
      - name: channel_id
        data_tests: [not_null]
  - name: fct_first_reply
    columns:
      - name: newcomer_id
        data_tests: [unique, not_null]
      - name: replier_id
        data_tests: [not_null]
  - name: fct_team_stats
    columns:
      - name: ds
        data_tests: [unique, not_null]
  - name: fct_top_posters
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: window_start
        data_tests: [not_null]
  - name: fct_member_channel
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: channel_id
        data_tests: [not_null]
      - name: messages
        data_tests: [not_null]
  - name: fct_member_channel_membership
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: channel_id
        data_tests: [not_null]
