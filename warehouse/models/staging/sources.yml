version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: member_dim
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: member_created_override
      - name: member_activity_snapshot
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: channel_dim
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: channel_activity_snapshot
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: message_activity_snapshot
      - name: thread
      - name: channel_walk
      - name: event_delivery
      - name: member_dim_snapshot
      - name: channel_dim_snapshot
      - name: team_stats_snapshot
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: top_posters_snapshot
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: ingest_run
      - name: ingest_step_output
      - name: analytics_day
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: member_message_history
      - name: member_channel_message
      - name: member_channel_membership
      - name: member_channel_walk
      - name: worker_heartbeat
      - name: deployment

  - name: archive
    schema: archive
    tables:
      - name: message
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}

  - name: ingest
    schema: ingest
    tables:
      - name: quality_result
      - name: incident_ack
      - name: slice_coverage
      - name: work_item
