version: 2

models:
  - name: mart_account_type
    config:
      contract:
        enforced: true
    columns:
      - name: account_type
        data_type: text
        data_tests: [not_null]
      - name: invited
        data_type: bigint
      - name: claimed
        data_type: bigint
      - name: window_start
        data_type: date
      - name: window_end
        data_type: date
      - name: metric_version
        data_type: text
  - name: mart_activity_distribution
    config:
      contract:
        enforced: true
    columns:
      - name: band_order
        data_type: integer
        data_tests: [not_null, unique]
      - name: activity_band
        data_type: text
      - name: members
        data_type: bigint
      - name: workspace_members
        data_type: bigint
      - name: window_start
        data_type: date
      - name: window_end
        data_type: date
      - name: metric_version
        data_type: text
  - name: mart_channel_activity
    config:
      contract:
        enforced: true
    columns:
      - name: channel_id
        data_type: text
        data_tests: [not_null]
      - name: window_start
        data_type: date
      - name: window_end
        data_type: date
      - name: messages_posted
        data_type: integer
      - name: messages_posted_by_members
        data_type: integer
      - name: members_who_posted
        data_type: integer
      - name: members_who_viewed
        data_type: integer
      - name: reactions_added
        data_type: integer
      - name: huddles_initiated
        data_type: integer
      - name: metric_version
        data_type: text
  - name: mart_channel_onboarding_scorecard
    config:
      contract:
        enforced: true
    columns:
      - name: channel_id
        data_type: text
        data_tests: [not_null]
      - name: channel_name
        data_type: text
      - name: post_month
        data_type: date
      - name: newcomer_volume
        data_type: bigint
      - name: fast_reply_count
        data_type: bigint
      - name: fast_reply_share
        data_type: numeric
      - name: retained_90_count
        data_type: bigint
      - name: retained_90_share
        data_type: numeric
      - name: day_90_mature
        data_type: boolean
      - name: metric_version
        data_type: text
  - name: mart_channel_bands
    config:
      contract:
        enforced: true
    columns:
      - name: measure
        data_type: text
        data_tests: [not_null]
      - name: measure_label
        data_type: text
      - name: measure_order
        data_type: integer
      - name: band_order
        data_type: integer
        data_tests: [not_null]
      - name: activity_band
        data_type: text
      - name: channels
        data_type: bigint
      - name: window_start
        data_type: date
      - name: window_end
        data_type: date
      - name: metric_version
        data_type: text
    data_tests:
      - unique:
          column_name: "measure || '-' || band_order"
  - name: mart_channel_range
    config:
      contract:
        enforced: true
    columns:
      - name: channel_id
        data_type: text
        data_tests: [not_null, unique]
      - name: name
        data_type: text
      - name: visibility
        data_type: text
      - name: total_members
        data_type: integer
      - name: full_members
        data_type: integer
      - name: guests
        data_type: integer
      - name: window_start
        data_type: date
      - name: window_end
        data_type: date
      - name: messages_posted
        data_type: integer
      - name: messages_posted_by_members
        data_type: integer
      - name: members_who_posted
        data_type: integer
      - name: members_who_viewed
        data_type: integer
      - name: reactions_added
        data_type: integer
      - name: members_who_reacted
        data_type: integer
      - name: huddles_initiated
        data_type: integer
      - name: date_created
        data_type: timestamptz
      - name: last_message_at
        data_type: timestamptz
      - name: metric_version
        data_type: text
  - name: mart_fast_reply_vs_retention
    config:
      contract:
        enforced: true
    columns:
      - name: fast_reply
        data_type: boolean
        data_tests: [not_null, unique]
      - name: newcomers
        data_type: bigint
      - name: measured_day_30
