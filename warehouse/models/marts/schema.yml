      - name: retained_day_30_rate
        data_type: numeric
      - name: measured_day_90
        data_type: bigint
      - name: retained_day_90_count
        data_type: bigint
      - name: retained_day_90_rate
        data_type: numeric
      - name: window_start
        data_type: date
      - name: window_end
        data_type: date
      - name: metric_version
        data_type: text
  - name: mart_growth
