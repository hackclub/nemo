<!doctype html>

<html lang="en">

  <head>

    <title>Something broke (500 Internal server error)</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0a0a">
    <script>try { var t = localStorage.getItem("mn-theme"); if (t) document.documentElement.dataset.theme = t; if (localStorage.getItem("mn-accent") === "none") document.documentElement.dataset.accent = "none" } catch (e) {}</script>

    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/icon.png">

    <style>

      @font-face {
        font-family: "Geist";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/geist-variable.woff2") format("woff2");
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      :root {
        color-scheme: light;
        --bg: oklch(1 0 0);
        --fg: oklch(0.145 0 0);
        --muted: oklch(0.556 0 0);
        --mark: oklch(0.556 0 0);
        --glow: oklch(0.75 0.15 52 / 0.16);
        --btn: oklch(0.56 0.155 48);
        --btn-fg: oklch(0.985 0 0);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: oklch(0.145 0 0);
          --fg: oklch(0.985 0 0);
          --muted: oklch(0.708 0 0);
          --mark: oklch(0.708 0 0);
          --glow: oklch(0.74 0.15 52 / 0.22);
          --btn: oklch(0.76 0.15 52);
          --btn-fg: oklch(0.159 0 0);
        }
      }

      :root[data-theme="lightsout"] {
        color-scheme: dark;
        --bg: oklch(0.145 0 0);
        --fg: oklch(0.985 0 0);
        --muted: oklch(0.708 0 0);
        --mark: oklch(0.708 0 0);
        --glow: oklch(0.74 0.15 52 / 0.22);
        --btn: oklch(0.76 0.15 52);
        --btn-fg: oklch(0.159 0 0);
      }

      :root[data-accent="none"] {
        --glow: oklch(0.556 0 0 / 0.1);
        --btn: oklch(0.205 0 0);
        --btn-fg: oklch(0.985 0 0);
      }

      :root[data-accent="none"][data-theme="lightsout"] {
        --btn: oklch(0.985 0 0);
        --btn-fg: oklch(0.205 0 0);
      }

      @media (prefers-color-scheme: dark) {
        :root[data-accent="none"]:not([data-theme="light"]) {
          --btn: oklch(0.985 0 0);
          --btn-fg: oklch(0.205 0 0);
        }
      }

      html {
        font-size: 16px;
      }

      body {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: radial-gradient(118% 78% at 50% 8%, var(--glow), transparent 58%), var(--bg);
        color: var(--fg);
        font-family: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      .marks {
        position: absolute;
        inset: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        pointer-events: none;
        color: var(--mark);
        opacity: 0.16;
      }

      main {
        display: grid;
        justify-items: center;
        text-align: center;
        max-width: 30rem;
      }

      .pod {
        display: block;
        width: 100%;
        max-width: 14rem;
        height: auto;
        filter: drop-shadow(0 16px 26px rgb(0 0 0 / 0.3));
      }

      .code {
        margin-top: 1rem;
        font-size: 3.5rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }

      .said {
        margin-top: 0.75rem;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .why {
        margin-top: 0.375rem;
        font-size: 0.875rem;
        color: var(--muted);
      }

      .home {
        display: inline-flex;
        align-items: center;
        height: 2.25rem;
        margin-top: 1.5rem;
        padding: 0 1rem;
        border-radius: 0.625rem;
        background: var(--btn);
        color: var(--btn-fg);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }

      .home:hover {
        opacity: 0.9;
      }

      .home:focus-visible {
        outline: 3px solid color-mix(in oklab, var(--fg) 30%, transparent);
        outline-offset: 2px;
      }

      .word {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 2.5rem;
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--muted);
      }

      .word img {
        display: block;
        width: 20px;
        height: auto;
      }

      @media (prefers-reduced-motion: no-preference) {
        .pod {
          animation: bob 7s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
        }
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-1deg); }
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/500.html -->

        <circle cx="712" cy="452" r="5" opacity=".7"/>
        <circle cx="332" cy="470" r="9" opacity=".8"/>

        <circle cx="1064" cy="330" r="4" opacity=".55"/>
        <circle cx="1006" cy="66" r="8" opacity=".7"/>
        <path d="M424 118 l7 22 22 7 -22 7 -7 22 -7-22 -22-7 22-7z" opacity=".9"/>
        <path d="M756 74 l6 18 18 6 -18 6 -6 18 -6-18 -18-6 18-6z" opacity=".8"/>
        <path d="M768 396 l10 30 30 10 -30 10 -10 30 -10-30 -30-10 30-10z" opacity=".95"/>
        <path d="M452 434 l13 0 0 13 -13 0z" opacity=".8" transform="rotate(45 458 440)"/>

      <g fill="none" stroke="currentColor" stroke-width="3">

        <circle cx="1128" cy="196" r="13" opacity=".55"/>
      </g>
    </svg>

    <main>
      <img class="pod" src="/nemo-pod.png" alt="" width="900" height="613">
      <p class="code">500</p>
      <p class="said">Something broke on this side.</p>
      <p class="why">The error is logged. Try again in a moment.</p>
      <a class="home" href="/">Back to Mnemosyne</a>
      <p class="word"><img src="/nemo.png" alt="" width="800" height="483">Mnemosyne</p>
    </main>

  </body>

</html>
