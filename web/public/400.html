<!doctype html>

<html lang="en">

  <head>

    <title>The request could not be read (400 Bad request)</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#143252">

    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/icon.png">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background-color: #143252;
        color: #f0e7d6;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: -0.0025em;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      .bands,
      .rules,
      .marks {
        position: absolute;
        pointer-events: none;
      }

      .bands {
        inset: -30% -10%;
        z-index: -3;
        background: repeating-linear-gradient(74deg,
          transparent 0 84px,
          #1c3f65 84px 146px,
          transparent 146px 336px);
      }

      .rules {
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(90deg, transparent 20.4%, #0a1726 20.4% 20.9%, transparent 20.9%),
          linear-gradient(90deg, transparent 79.2%, #0a1726 79.2% 79.7%, transparent 79.7%);
      }

      .marks {
        inset: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
      }

      main {
        display: grid;
        justify-items: center;
        text-align: center;
        max-width: 30rem;
      }

      .pod {
        display: block;
        width: 100%;
        max-width: 18rem;
        height: auto;
        filter: drop-shadow(0 16px 26px rgb(4 12 22 / 0.45));
      }

      .code {
        margin-top: 0.75rem;
        font-size: clamp(3rem, 11vw, 4.5rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        color: #f5e8cf;
      }

      .said {
        margin-top: 0.625rem;
        font-size: clamp(1rem, 3vw, 1.1875rem);
        font-weight: 600;
        color: #f5e8cf;
      }

      .why {
        margin-top: 0.375rem;
        font-size: 0.875rem;
        color: #a9bed5;
      }

      .word {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 2.25rem;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #8ea9c6;
      }

      .word img {
        display: block;
        width: 20px;
        height: auto;
      }

      @media (prefers-reduced-motion: no-preference) {
        .pod {
          animation: bob 7s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
        }
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-1deg); }
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/400.html -->

    <div class="bands"></div>
    <div class="rules"></div>

    <svg class="marks" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
      <g fill="#f5e8cf">
        <circle cx="298" cy="66" r="7" opacity=".85"/>
        <circle cx="712" cy="452" r="5" opacity=".7"/>
        <circle cx="332" cy="470" r="9" opacity=".8"/>
        <circle cx="908" cy="124" r="6" opacity=".6"/>
        <circle cx="1064" cy="330" r="4" opacity=".55"/>
        <circle cx="1006" cy="66" r="8" opacity=".7"/>
        <path d="M424 118 l7 22 22 7 -22 7 -7 22 -7-22 -22-7 22-7z" opacity=".9"/>
        <path d="M756 74 l6 18 18 6 -18 6 -6 18 -6-18 -18-6 18-6z" opacity=".8"/>
        <path d="M768 396 l10 30 30 10 -30 10 -10 30 -10-30 -30-10 30-10z" opacity=".95"/>
        <path d="M452 434 l13 0 0 13 -13 0z" opacity=".8" transform="rotate(45 458 440)"/>
      </g>
      <g fill="none" stroke="#f5e8cf" stroke-width="3">
        <circle cx="372" cy="44" r="16" opacity=".85"/>
        <circle cx="856" cy="446" r="24" opacity=".9"/>
        <path d="M866 456 a14 14 0 0 0 -10 -14" stroke-width="4" opacity=".9"/>
        <circle cx="140" cy="248" r="10" opacity=".5"/>
        <circle cx="1128" cy="196" r="13" opacity=".55"/>
      </g>
    </svg>

    <main>
      <img class="pod" src="/nemo-pod.png" alt="" width="900" height="613">
      <p class="code">400</p>
      <p class="said">The request could not be read.</p>
      <p class="why">Check the request and try again.</p>
      <p class="word"><img src="/nemo.png" alt="" width="800" height="483">Mnemosyne</p>
    </main>

  </body>

</html>
