[project]
name = "mnemosyne-proxy"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0",
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
    "slack-sdk>=3.33",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
