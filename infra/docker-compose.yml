services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      DBT_DB_PASSWORD: ${DBT_DB_PASSWORD}
      RAILS_DB_PASSWORD: ${RAILS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./postgres/role-passwords.sh:/docker-entrypoint-initdb.d/01-role-passwords.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  events-listener:
    profiles: ["live"]
    image: mnemosyne:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      INTERNAL_PROXY_URL: ${CONTAINER_PROXY_URL:-${INTERNAL_PROXY_URL}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["collect"]

  nightly-sync:
    profiles: ["live"]
    image: mnemosyne:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      NIGHTLY_AT: ${NIGHTLY_AT:-03:00}
      NIGHTLY_RUN_AT_START: ${NIGHTLY_RUN_AT_START:-false}
      SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-60}
      TZ: ${TZ:-UTC}
      INTERNAL_PROXY_URL: ${CONTAINER_PROXY_URL:-${INTERNAL_PROXY_URL}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["sync"]

  provision:
    profiles: ["seed"]
    image: mnemosyne:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    restart: "no"
    command: ["provision"]

  seed:
    profiles: ["seed"]
    image: mnemosyne:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      SEED_ALLOW_DB: ${SEED_ALLOW_DB:-}
      SEED_HOSTILE: ${SEED_HOSTILE:-}
      TZ: ${TZ:-UTC}
    restart: "no"
    command:
      - seed
      - --scale
      - ${SEED_SCALE:-dev}
      - --seed
      - ${SEED_RNG:-1}
      - --history-months
      - ${SEED_HISTORY_MONTHS:-16}

  web:
    image: mnemosyne:latest
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      APP_HOST: ${APP_HOST:-}
      TLS_DOMAIN: ${TLS_DOMAIN:-}
      TZ: ${TZ:-UTC}
      INTERNAL_PROXY_URL: ${CONTAINER_PROXY_URL:-${INTERNAL_PROXY_URL}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    restart: unless-stopped

volumes:
  pgdata:
