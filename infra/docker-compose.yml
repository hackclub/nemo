services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      DBT_DB_PASSWORD: ${DBT_DB_PASSWORD}
      RAILS_DB_PASSWORD: ${RAILS_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./postgres/role-passwords.sh:/docker-entrypoint-initdb.d/01-role-passwords.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  events-listener:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "ingest.events_listener"]

  nightly-sync:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      NIGHTLY_AT: ${NIGHTLY_AT:-03:00}
      NIGHTLY_JOIN_CHANNELS: ${NIGHTLY_JOIN_CHANNELS:-false}
      SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-15}
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "jobs.sync_worker"]

volumes:
  pgdata:
