display_information:
  name: Mnemosyne Pipeline
  description: Automated Slack data ingestion for Mnemosyne
  background_color: "#611f69"

features:
  bot_user:
    display_name: mnemosyne-pipeline
    always_online: true

oauth_config:
  scopes:
    bot:
      - channels:read
      - users:read
    user:
      - admin.analytics:read
      - admin.users:read
      - admin.teams:read
      - admin.roles:read

settings:
  event_subscriptions:
    bot_events:
      - team_join
  socket_mode_enabled: true
