display_information:
  name: Nemo
  description: Fire Engine in Slack. Cases, actions and the records.
  background_color: "#1c1917"

features:
  bot_user:
    display_name: nemo
    always_online: true
  shortcuts:
    - name: Destroy thread
      type: message
      callback_id: destroy_thread
      description: Keep the thread on the record, then remove it from Slack
    - name: Lock thread
      type: message
      callback_id: lock_thread
      description: Stop new replies until the lock lifts
  slash_commands:
    - command: /nemo
      description: Look somebody up, note something, open a case, or pull one up
      usage_hint: help | lookup @somebody | note @somebody | open @somebody | 3864
      should_escape: true

oauth_config:
  redirect_urls:
    - https://localhost:3000/fd/slack_account/callback
  scopes:
    user:
      - admin
      - admin.analytics:read
      - admin.conversations:read
      - admin.teams:read
      - admin.users:read
      - admin.users:write
      - auditlogs:read
      - channels:history
      - channels:read
      - channels:write
      - chat:write
      - groups:history
      - groups:write
      - search:read
      - users:read
    bot:
      - chat:write
      - chat:write.customize
      - files:read
      - files:write
      - channels:read
      - channels:history
      - channels:join
      - channels:manage
      - groups:read
      - groups:history
      - groups:write
      - reactions:write
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - channel_created
      - channel_left
      - group_left
      - member_joined_channel
      - member_left_channel
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
