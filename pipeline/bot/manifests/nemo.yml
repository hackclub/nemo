display_information:
  name: Nemo
  description: Fire Engine in Slack. Cases, actions and the records.
  background_color: "#1c1917"

features:
  bot_user:
    display_name: nemo
    always_online: true
  slash_commands:
    - command: /nemo
      description: Look somebody up, or pull up a case
      usage_hint: lookup @somebody | 3864
      should_escape: true

oauth_config:
  redirect_urls:
    - https://localhost:3000/fd/slack_account/callback
  scopes:
    user:
      - chat:write
    bot:
      - chat:write
      - chat:write.customize
      - files:read
      - files:write
      - channels:history
      - groups:history
      - reactions:read
      - reactions:write
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
