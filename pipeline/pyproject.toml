[project]
name = "mnemosyne-pipeline"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "slack-sdk>=3.33",
    "slack-bolt>=1.20",
    "jsonschema>=4.23",
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
    "dbt-postgres>=1.9",
    "pyyaml>=6",
    "pillow>=11",
    "maxminddb>=3.2.0",
    "regex>=2024.11.6",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
