name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mnemosyne_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mnemosyne_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: mnemosyne_test
      POSTGRES_TEST_DB: mnemosyne_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci
      PIPELINE_DB_USER: pipeline_writer
      PIPELINE_DB_PASSWORD: ci
      DBT_DB_USER: dbt_owner
      DBT_DB_PASSWORD: ci
      RAILS_DB_USER: rails_app
      RAILS_DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: pipeline
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: web
      - name: schemas, roles, grants and both migration sets
        run: ./bin/nemo provision
      - name: seed, build the warehouse, verify
        run: ./bin/nemo seed --scale tiny
      - name: rails tests
        run: bin/rails test
        working-directory: web

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: web
      - run: bundle exec rubocop
