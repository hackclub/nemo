shared_networks:
  rotates_above: 5.0
  crowds_above: 40
  min_sightings: 2

staff_domains:
  - hackclub.com

network_classes:
  vpn:
    names: [Proton AG, M247, Datacamp, WorldStream, tzulo, Clouvider, Cloudflare]
    asns: [36183, 54113]
  hosting:
    names: []
    asns: []
  rotating:
    names: [Reliance Jio, Bharti Airtel, T-Mobile, Verizon Wireless]
    asns: []

signals:
  ip_exact:
    label: Signed in from the same address
    evidence: the same IP address
    weight: 5.0
    crowd_ceiling: 8
    family: network

  ip_prefix:
    label: Signed in from the same network
    evidence: the same /24 or /64
    weight: 3.0
    crowd_ceiling: 20
    family: network

  email_domain:
    label: Share an email domain
    evidence: the domain their address sits on
    weight: 2.0
    crowd_ceiling: 30
    family: identity

  session_agent:
    label: Same app and system
    evidence: the client they signed in with
    weight: 1.0
    crowd_ceiling: 60
    corroborating: true
    family: device

  joined_together:
    label: Joined within minutes of each other
    evidence: how close their arrivals were
    weight: 1.5
    window_seconds: 300
    crowd_ceiling: 25
    family: arrival

network_signals:
  ip_stable:
    label: Signed in from the same home or office address
    weight: 5.0
    crowd_ceiling: 8

  ip_same_hour:
    label: On the same home or office address in the same hour
    weight: 2.0
    crowd_ceiling: 8

  ip_many:
    label: Shared two or more home or office addresses
    weight: 1.5

  ip_hourly:
    label: Same mobile, VPN or hosting address in the same hour with the same browser
    weight: 2.0
    crowd_ceiling: 4

  ip_prefix_stable:
    label: Signed in from the same home network range
    weight: 2.0
    crowd_ceiling: 20
    corroborating: true

device_signals:
  device_agent:
    label: Same browser or app build, word for word
    weight: 3.0
    crowd_ceiling: 25

  device_ja4:
    label: Same TLS fingerprint
    weight: 1.0
    crowd_ceiling: 25
    corroborating: true

identity_signals:
  mailbox_alias:
    label: Same mailbox, once dots and plus tags are removed
    weight: 8.0
    crowd_ceiling: 10

  local_part:
    label: Same mailbox name on another domain
    weight: 3.0
    crowd_ceiling: 5

name_signals:
  full_name:
    label: Same full name
    weight: 3.0
    crowd_ceiling: 5

  display_name:
    label: Same display name
    weight: 2.0
    crowd_ceiling: 5

  handle_stem:
    label: Same handle, ignoring trailing numbers
    weight: 2.0
    crowd_ceiling: 5

arrival_signals:
  created_same_address:
    label: Joined within minutes of each other from the same address
    weight: 3.0
    crowd_ceiling: 5
    window_seconds: 1800

  invited_by:
    label: One account invited the other
    weight: 2.0
    crowd_ceiling: 20

  after_ban_address:
    label: First seen on a deactivated member's home address after the deactivation
    weight: 3.0
    crowd_ceiling: 8

  after_ban_device:
    label: First seen with a deactivated member's device build after the deactivation
    weight: 2.0
    crowd_ceiling: 25

against:
  two_countries:
    label: Active from two countries in the same hour, neither on a VPN
    weight: -3.0

families:
  network:
    cap: 6.0
  identity:
    cap: 8.0
  name:
    cap: 4.0
  device:
    cap: 4.0
  arrival:
    cap: 4.0

scoring:
  floor: 3.0
  strong: 5.0
  certain: 8.0
  most_per_member: 25
