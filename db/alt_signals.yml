shared_networks:
  rotates_above: 5.0
  crowds_above: 40
  min_sightings: 2

staff_domains:
  - hackclub.com

network_classes:
  vpn:
    names: [Proton AG, M247, Datacamp, WorldStream, tzulo, Clouvider, Cloudflare]
    asns: [36183, 54113]
  hosting:
    names: []
    asns: []
  rotating:
    names: [Reliance Jio, Bharti Airtel, T-Mobile, Verizon Wireless]
    asns: []

network_signals:
  ip_stable:
    label: Signed in from the same home or office address
    weight: 5.0
    crowd_ceiling: 8
    range_ceiling: 20

  ip_same_hour:
    label: On the same home or office address in the same hour
    weight: 2.0
    crowd_ceiling: 8
    corroborating: true

  ip_many:
    label: Shared two or more home or office addresses
    weight: 1.5

  ip_hourly:
    label: Same mobile, VPN or hosting address in the same hour with the same browser
    weight: 3.0
    crowd_ceiling: 4

  ip_prefix_stable:
    label: Signed in from the same home network range
    weight: 2.0
    crowd_ceiling: 20
    corroborating: true

  ip_burst:
    label: Joined the same week and shared a mobile, VPN or hosting address in the same hour with the same browser
    weight: 3.0
    crowd_ceiling: 8
    window_days: 7

device_signals:
  device_agent:
    label: Same browser or app build, word for word
    weight: 3.0
    crowd_ceiling: 5
    corroborating: true

  session_agent:
    label: Same app and system
    weight: 1.0
    crowd_ceiling: 60
    corroborating: true

  device_ja4:
    label: Same TLS fingerprint
    weight: 1.0
    crowd_ceiling: 25
    corroborating: true

identity_signals:
  email_domain:
    label: Share an email domain
    weight: 2.0
    crowd_ceiling: 30
    corroborating: true

  mailbox_alias:
    label: Same mailbox, once dots and plus tags are removed
    weight: 8.0
    crowd_ceiling: 100

  local_part:
    label: Same mailbox name on another domain
    weight: 3.0
    crowd_ceiling: 5

name_signals:
  full_name:
    label: Same full name
    weight: 3.0
    crowd_ceiling: 5
    corroborating: true

  display_name:
    label: Same display name
    weight: 2.0
    crowd_ceiling: 5
    corroborating: true

  handle_stem:
    label: Same handle, ignoring trailing numbers
    weight: 2.0
    crowd_ceiling: 5
    corroborating: true

  handle_stem_long:
    label: Same long handle, ignoring trailing numbers
    weight: 4.0
    crowd_ceiling: 20

arrival_signals:
  joined_together:
    label: Joined within minutes of each other
    weight: 1.5
    window_seconds: 300
    crowd_ceiling: 25
    corroborating: true

  created_same_address:
    label: Joined within minutes of each other from the same address
    weight: 3.0
    crowd_ceiling: 5
    window_seconds: 1800

  invited_by:
    label: One account invited the other
    weight: 2.0
    crowd_ceiling: 20

  after_ban_address:
    label: First seen on a deactivated member's home address after the deactivation
    weight: 3.0
    crowd_ceiling: 8

  after_ban_device:
    label: First seen with a deactivated member's device build after the deactivation
    weight: 2.0
    crowd_ceiling: 25

against:
  two_countries:
    label: Active from two countries in the same hour, neither on a VPN
    weight: -3.0

labels:
  staff_test:
    label: Both accounts have staff mailboxes

  classroom:
    label: A school network or a managed school device
    weight: -2.0
    networks: [school, district, education, universit, college, academy, k12]
    devices: [CrOS]

  household:
    label: Same surname, different first names, one home line
    weight: -2.0

families:
  network:
    cap: 6.0
  identity:
    cap: 8.0
  name:
    cap: 4.0
  device:
    cap: 4.0
  arrival:
    cap: 4.0

clusters:
  edge_score: 5.0
  ring:
    min_accounts: 4
    window_minutes: 60

band_targets:
  least_verdicts: 20
  precision:
    floor: 0.5
    strong: 0.9
    certain: 0.98

scoring:
  floor: 3.0
  strong: 5.0
  certain: 8.0
  most_per_member: 25
