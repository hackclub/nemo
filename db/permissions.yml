roles:
  - firefighter
  - lead
  - community_manager

role_labels:
  firefighter: Firefighter
  lead: Lead
  community_manager: Community manager

role_sets:
  everyone: [firefighter, lead, community_manager]
  lead: [lead, community_manager]
  manager: [community_manager]

areas:
  case: Cases
  decision: Decisions
  member: People and access
  identity: People and access
  access: People and access
  slack: Your own account
  app: The dashboard
  engine: Engine

locked:
  - access.grant

permissions:
  case.read:
    label: Read every case, note and thread
    held_by: everyone
    events: []

  case.open:
    label: Open a case, claim it, hand it back
    held_by: everyone
    events: [case/opened, assignee/claimed, assignee/unclaimed]

  case.note:
    label: Write a note, delete their own
    held_by: everyone
    scope: author
    events: [note/noted, note/deleted]

  case.people:
    label: Add somebody, take somebody off
    held_by: everyone
    scope: assigned
    events: [participant/attached, participant/detached]

  case.thread:
    label: Attach a thread, flag a message
    held_by: everyone
    scope: assigned
    events: [thread/attached, thread/detached, citation/flagged, citation/unflagged]

  case.chat:
    label: Talk to the team on a case
    held_by: everyone
    events: []

  case.reply:
    label: Answer the reporter
    held_by: everyone
    events: [report/answered]

  case.act:
    label: Log an action against somebody
    held_by: everyone
    scope: assigned
    events: [action/performed]

  case.resolve:
    label: Resolve a case, mark a duplicate
    held_by: everyone
    events: [case/resolved]

  case.reverse:
    label: Reverse an action somebody logged
    held_by: everyone
    scope: assigned
    events: [action/reversed]

  case.reopen:
    label: Put a resolved case back in the queue
    held_by: everyone
    events: [case/reopened]

  decision.write:
    label: Propose one, reword any of them, drop their own
    held_by: everyone
    events: [decision/proposed, decision/amended, decision/dropped]

  decision.link:
    label: Link threads, link a case to a decision
    held_by: everyone
    events: [decision_thread/attached, decision_thread/detached, case/followed, case/unfollowed]

  decision.settle:
    label: Settle a proposal, putting it in force
    held_by: lead
    events: [decision/settled]

  decision.retire:
    label: Supersede or retire a rule
    held_by: lead
    events: [decision/superseded]

  member.note:
    label: Write a standing note about a member
    held_by: everyone
    events: []

  identity.read:
    label: See the real name and email behind an id
    held_by: everyone
    events: []
    logged: true

  slack.link:
    label: Link their own Slack account, to send as themselves
    held_by: everyone
    events: [slack_account/linked, slack_account/unlinked]

  access.read:
    label: See who holds access and what they did with it
    held_by: manager
    events: []

  access.grant:
    label: Give or take back access
    held_by: manager
    events: [grant/granted, grant/revoked, permission/granted, permission/revoked]

  app.flip:
    label: Turn a section of the dashboard on or off
    held_by: manager
    events: [flag/turned_on, flag/turned_off]

  engine.run:
    label: Trigger a stage, or cancel a sync that is running
    held_by: lead
    events: []

  engine.sync:
    label: Queue a full sync of every source
    held_by: manager
    events: []
