checks:
  - name: a firefighter may claim any open case
    role: firefighter
    key: case.open
    case: free
    allowed: true

  - name: a firefighter may categorise a case assigned to them
    role: firefighter
    key: case.categorise
    case: mine
    allowed: true

  - name: a firefighter may not categorise somebody else's case
    role: firefighter
    key: case.categorise
    case: theirs
    allowed: false

  - name: a firefighter may act on a case nobody holds
    role: firefighter
    key: case.act
    case: free
    allowed: true

  - name: a firefighter may act on their own case
    role: firefighter
    key: case.act
    case: mine
    allowed: true

  - name: a firefighter may not act on somebody else's case
    role: firefighter
    key: case.act
    case: theirs
    allowed: false

  - name: a firefighter may not act on somebody else's case either
    role: firefighter
    key: case.act
    case: theirs
    allowed: false

  - name: a firefighter may not reverse an action on somebody else's case
    role: firefighter
    key: case.reverse
    case: theirs
    allowed: false

  - name: a firefighter may not put somebody on a case that is not theirs
    role: firefighter
    key: case.people
    case: theirs
    allowed: false

  - name: a firefighter may not attach a thread to somebody else's case
    role: firefighter
    key: case.thread
    case: theirs
    allowed: false

  - name: resolving is not scoped, so anybody holding it may resolve
    role: firefighter
    key: case.resolve
    case: theirs
    allowed: true

  - name: a firefighter may not grant access
    role: firefighter
    key: access.grant
    allowed: false

  - name: nobody without a grant gets anything
    role: null
    key: case.read
    allowed: false

  - name: an override can take a permission away from a role
    role: firefighter
    key: case.resolve
    moved: { firefighter: false }
    allowed: false

  - name: an override does not widen the scope check
    role: firefighter
    key: case.act
    case: theirs
    moved: { firefighter: true }
    allowed: false

  - name: a community manager may act on a case nobody holds
    manager: true
    key: case.act
    case: free
    allowed: true

  - name: a community manager may not act on somebody else's case either
    manager: true
    key: case.act
    case: theirs
    allowed: false

  - name: a community manager may take access back
    manager: true
    key: access.grant
    allowed: true

  - name: a community manager needs no grant row at all
    manager: true
    key: case.read
    allowed: true

  - name: a community manager keeps a permission an override took from a role
    manager: true
    key: case.resolve
    moved:
      firefighter: false
    allowed: true
